# Top-of-page info widgets (shown left to right)
- greeting:
    text_size: xl
    text: Faid's Lab

- datetime:
    text_size: l
    format:
      dateStyle: long
      timeStyle: short
      hour12: true

# Open-Meteo: free, no API key. Coordinates come from .env so they never land in Git.
- openmeteo:
    label: Weather
    latitude: "{{HOMEPAGE_VAR_LATITUDE}}"
    longitude: "{{HOMEPAGE_VAR_LONGITUDE}}"
    units: imperial
    cache: 5

- search:
    provider: duckduckgo
    target: _blank
